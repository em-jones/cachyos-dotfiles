unbind C-b
bind \\ split-window -h
bind - split-window -v
set -g prefix C-Space
set -g mode-keys vi
set -g escape-time 20
set-option -g default-terminal "screen-256color"
set-option -g status-position top

# move between tmux pane and vim/nvim/lvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }
bind-key -n 'C--' if-shell "$is_vim" 'send-keys C--' 

# alt+n / alt+p to move between windows (tabs)
bind-key -n 'M-1' select-window -t =0
bind-key -n 'M-2' select-window -t =1
bind-key -n 'M-3' select-window -t =2
bind-key -n 'M-4' select-window -t =3
bind-key -n 'M-5' select-window -t =4
bind-key -n 'M-6' select-window -t =5

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

# --- Nord palette ---
set -g @nord0 "#2e3440"
set -g @nord1 "#3b4252"
set -g @nord2 "#434c5e"
set -g @nord3 "#4c566a"
set -g @nord4 "#d8dee9"
set -g @nord5 "#e5e9f0"
set -g @nord6 "#eceff4"
set -g @nord7 "#8fbcbb"
set -g @nord8 "#88c0d0"
set -g @nord9 "#81a1c1"
set -g @nord10 "#5e81ac"
set -g @nord11 "#bf616a"
set -g @nord12 "#d08770"
set -g @nord13 "#ebcb8b"
set -g @nord14 "#a3be8c"
set -g @nord15 "#b48ead"

# --- Nord status bar ---
set -g status-style "bg=#{@nord1},fg=#{@nord4}"
set -g status-left "#[bg=#{@nord10},fg=#{@nord6}] #S #[bg=#{@nord1},fg=#{@nord4}] "
set -g status-right "#[bg=#{@nord1},fg=#{@nord4}] %H:%M #[bg=#{@nord10},fg=#{@nord6}] %d %b "
setw -g window-status-format "#[bg=#{@nord1},fg=#{@nord4}] #I:#W "
setw -g window-status-current-format "#[bg=#{@nord10},fg=#{@nord6}] #I:#W "
setw -g window-status-activity-style "bg=#{@nord1},fg=#{@nord13}"
setw -g window-status-bell-style "bg=#{@nord11},fg=#{@nord6}"
setw -g window-status-separator ""
set -g message-style "bg=#{@nord10},fg=#{@nord6}"
set -g message-command-style "bg=#{@nord10},fg=#{@nord6}"
set -g clock-mode-colour "#88c0d0"
set -g copy-mode-match-style "bg=#{@nord13},fg=#{@nord0}"
set -g copy-mode-current-match-style "bg=#{@nord8},fg=#{@nord0}"
set -g copy-mode-mark-style "bg=#{@nord10},fg=#{@nord6}"

# --- Nord pane theme: gap between panes + path/process header ---
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "bg=#{@nord0},fg=#{@nord0}"
set -g pane-active-border-style "bg=#{@nord0},fg=#{@nord10}"
set -g pane-border-format "#{?pane_active,#[bg=#{@nord1},fg=#{@nord8}],#[bg=#{@nord0},fg=#{@nord3}]} #{b:pane_current_path}  #{pane_current_command} "
